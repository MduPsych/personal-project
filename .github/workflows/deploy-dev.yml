name: Deploy to Dev

on:
  push:
    branches:
      - dev

env:
  AWS_DEFAULT_REGION: af-south-1
  ENVIRONMENT: dev
  TF_VAR_environment: dev
  TF_VAR_aws_region: af-south-1
  TF_VAR_lambda_artifact_path: ../email-assistant.zip

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: pip install flake8 black mypy boto3

      - name: Lint with flake8
        run: flake8 src/lambda/handler.py

      - name: Check formatting with black
        run: black --check src/lambda/handler.py

      - name: Type check with mypy
        run: mypy src/lambda/handler.py --ignore-missing-imports

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install safety bandit boto3

      - name: Scan dependencies for vulnerabilities
        run: safety check -r src/lambda/requirements.txt

      - name: SAST scan with Bandit
        run: bandit -r src/lambda/handler.py -ll

      - name: Scan for secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pytest-cov boto3

      - name: Run tests with coverage
        run: |
          cd src/lambda
          pytest tests/ -v \
            --cov=handler \
            --cov-report=term-missing \
            --cov-fail-under=80

  build-artifact:
    name: Build Lambda Artifact
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Install dependencies into package
        run: |
          mkdir -p lambda-package
          pip install \
            -r src/lambda/requirements.txt \
            -t lambda-package/

      - name: Package Lambda
        run: |
          cp src/lambda/handler.py lambda-package/
          cd lambda-package
          zip -r ../email-assistant.zip .

      - name: Upload artifact to S3
        run: |
          aws s3 cp email-assistant.zip \
            s3://mdu-terraform-state-2026/artifacts/dev/email-assistant.zip

      - name: Upload artifact for pipeline
        uses: actions/upload-artifact@v4
        with:
          name: lambda-artifact
          path: email-assistant.zip

  infrastructure-security:
    name: Infrastructure Security
    runs-on: ubuntu-latest
    needs: build-artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform -chdir=infrastructure init \
            -backend-config=backends/dev.hcl

      - name: Terraform Validate
        run: terraform -chdir=infrastructure validate

      - name: Run Checkov IaC security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          soft_fail: true
          skip_check: CKV_AWS_272,CKV_AWS_117
          
      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifact
          path: .

      - name: Terraform Plan
        run: |
          terraform -chdir=infrastructure plan \
            -var="lambda_artifact_path=../email-assistant.zip" \
            -no-color
      - name: Terraform Plan
        run: |
          terraform -chdir=infrastructure plan \
            -var="lambda_artifact_path=../email-assistant.zip" \
            -no-color

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: infrastructure-security
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifact

      - name: Terraform Init
        run: |
          terraform -chdir=infrastructure init \
            -backend-config=backends/dev.hcl

      - name: Terraform Apply
        run: |
          terraform -chdir=infrastructure apply \
            -auto-approve \
            -var="lambda_artifact_path=../email-assistant.zip" \
            -no-color

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pytest

      - name: Run integration tests
        run: pytest src/lambda/tests/ -v -k "integration"
        continue-on-error: true

  notify-dev:
    name: Notify
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.integration-tests.result == 'success' }}
        run: echo "Dev deployment successful"

      - name: Notify on failure
        if: ${{ needs.integration-tests.result == 'failure' }}
        run: echo "Dev deployment failed"